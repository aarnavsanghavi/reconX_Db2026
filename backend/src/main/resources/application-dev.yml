spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/reconx
    username: reconx_user
    password: reconx_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update #changed to update for creation of audit tables change back to validate in case of build failures later on


  liquibase:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    listener:
      missing-topics-fatal: false

logging:
  level:
    com.dbtraining.reconx: DEBUG