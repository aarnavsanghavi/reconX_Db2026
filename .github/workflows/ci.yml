name: CI

on:
  push:
    branches:
      - main
      - develop
      - aarnav
    tags:
      - "v*"

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build recon-audit-starter
        working-directory: recon-audit-starter
        run: |
          chmod +x mvnw
          ./mvnw -B clean install

      - name: Backend Checkstyle
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B checkstyle:check || true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend Lint
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run lint --if-present

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reconx
          POSTGRES_USER: reconx_user
          POSTGRES_PASSWORD: reconx_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U reconx_user -d reconx"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build recon-audit-starter
        working-directory: recon-audit-starter
        run: |
          chmod +x mvnw
          ./mvnw -B clean install

      - name: Liquibase Validate
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B liquibase:validate \
            -Dliquibase.changeLogFile=src/main/resources/db/changelog/db.changelog-master.xml \
            -Dliquibase.url=jdbc:postgresql://localhost:5432/reconx \
            -Dliquibase.username=reconx_user \
            -Dliquibase.password=reconx_pass

      - name: Backend Tests
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend Tests
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm test --if-present
          npm run build

  build-and-push:
    needs:
      - test

    timeout-minutes: 30

    runs-on: ubuntu-latest

    if: >
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')
      )

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/reconx-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/reconx-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.backend-meta.outputs.tags }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.frontend-meta.outputs.tags }}